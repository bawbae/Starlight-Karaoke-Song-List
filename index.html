<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlight Karaoke Song List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #222;
      color: #eee;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li.song {
      padding: 10px;
      margin-bottom: 8px;
      background: #1a1a1a;
      border-radius: 6px;
    }
    li.song h2 {
      margin: 0;
      font-size: 18px;
    }
    li.song p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #aaa;
    }
    .center {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>🎤 Starlight Karaoke Song List 🎶</h1>

  <div id="controls">
    <input type="text" id="searchInput" placeholder="Search by song or artist...">
    <select id="genreFilter"></select>
  </div>

  <ul id="songList"></ul>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTolM1gw_aADMSzbb-nMyJTCj2yBxbqmUgJ_CYWPuIyXXAnOide38qpGmTAjwjHA1QaVwKW5l7HfID9/pub?gid=0&single=true&output=csv";

    const songList = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const genreFilter = document.getElementById("genreFilter");

    let songs = [];
    let currentGenre = "all";

    const escapeHtml = (str = "") => str.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    function renderGenreOptions() {
      const uniqueGenres = [...new Map(songs.map(s => [s.genre?.toLowerCase(), s.genre])).values()]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

      genreFilter.innerHTML = '<option value="all">All Genres</option>';
      uniqueGenres.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g.toLowerCase();
        opt.textContent = g;
        genreFilter.appendChild(opt);
      });
    }

    function renderSongs(query = "") {
      songList.innerHTML = "";
      const q = query.toLowerCase().trim();

      const filtered = songs.filter(({ title, artist, genre }) =>
        title &&
        (currentGenre === "all" || (genre || "").toLowerCase() === currentGenre) &&
        (title.toLowerCase().includes(q) || (artist || "").toLowerCase().includes(q))
      );

      if (!filtered.length) {
        songList.innerHTML = `<li class="center">No songs found</li>`;
        return;
      }

      filtered.forEach(({ title, artist }) => {
        const li = document.createElement("li");
        li.className = "song";
        li.innerHTML = `<h2>${escapeHtml(title)}</h2>
                        <p class="artist">by ${escapeHtml(artist || "Unknown")}</p>`;
        songList.appendChild(li);
      });
    }

    function fetchSongs() {
      console.log("Fetching songs from:", sheetURL);
      Papa.parse(sheetURL, {
        download: true,
        skipEmptyLines: true,
        complete: ({ data }) => {
          console.log("Raw data:", data);

          try {
            const rows = data.slice(1); // skip header row
            songs = rows.map(([title, artist, genre]) => ({
              title: title?.trim().replace(/^\uFEFF/, "") || "",
              artist: artist?.trim() || "",
              genre: genre?.trim() || ""
            })).filter(({ title }) => title);

            console.log("Parsed songs:", songs);
            renderGenreOptions();
            renderSongs(searchInput.value);
          } catch (e) {
            console.error("Parse error:", e);
            songList.innerHTML = `<li class="center" style="color:tomato">Error parsing data</li>`;
          }
        },
        error: err => {
          console.error("PapaParse error:", err);
          songList.innerHTML = `<li class="center" style="color:tomato">Error: ${err.message}</li>`;
        }
      });
    }

    // Events
    searchInput.addEventListener("input", e => renderSongs(e.target.value));
    genreFilter.addEventListener("change", e => {
      currentGenre = e.target.value || "all";
      renderSongs(searchInput.value);
    });

    // Fetch immediately when page loads
    fetchSongs();
  </script>
</body>
</html>
