<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starlight Karaoke Song List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    h1 {
      color: #fdd835;
    }
    select, button {
      margin: 10px;
      padding: 8px;
      font-size: 16px;
      border-radius: 8px;
    }
    #songDisplay {
      margin-top: 20px;
      font-size: 18px;
      color: #f5f5f5;
    }
  </style>
</head>
<body>
  <h1>🌟 Starlight Karaoke Song List 🌟</h1>

  <!-- Dropdown for artists -->
  <label for="artistSelect">Choose an Artist:</label>
  <select id="artistSelect">
    <option value="">-- Select an Artist --</option>
  </select>

  <!-- Dropdown for songs -->
  <label for="songSelect">Choose a Song:</label>
  <select id="songSelect">
    <option value="">-- Select a Song --</option>
  </select>

  <br>
  <button id="showBtn">Enter Song List</button>

  <div id="songDisplay"></div>

  <script>
    // Example song data
    const songs = [
      { title: "Someone Like You", artist: "Adele" },
      { title: "Rolling in the Deep", artist: "Adele" },
      { title: "Shape of You", artist: "Ed Sheeran" },
      { title: "Perfect", artist: "Ed Sheeran" },
      { title: "Bad Romance", artist: "Lady Gaga" },
      { title: "Shallow", artist: "Lady Gaga" }
    ];

    const songSelect = document.getElementById("songSelect");
    const artistSelect = document.getElementById("artistSelect");
    const display = document.getElementById("songDisplay");

    // Populate artist dropdown (unique values)
    const uniqueArtists = [...new Set(songs.map(song => song.artist))];
    uniqueArtists.forEach(artist => {
      const option = document.createElement("option");
      option.value = artist;
      option.textContent = artist;
      artistSelect.appendChild(option);
    });

    // Function to populate songs dropdown
    function populateSongs(artist = "") {
      songSelect.innerHTML = '<option value="">-- Select a Song --</option>';
      const filtered = artist ? songs.filter(s => s.artist === artist) : songs;
      filtered.forEach(song => {
        const option = document.createElement("option");
        option.value = song.title;
        option.textContent = song.title;
        songSelect.appendChild(option);
      });
    }

    // Initial load: show all songs
    populateSongs();

    // When artist is chosen, filter songs dropdown
    artistSelect.addEventListener("change", () => {
      populateSongs(artistSelect.value);
    });

    // Show result when button clicked
    document.getElementById("showBtn").addEventListener("click", () => {
      const selectedSong = songSelect.value;
      const selectedArtist = artistSelect.value;

      if (selectedSong) {
        const found = songs.find(song => song.title === selectedSong);
        display.textContent = `🎤 You chose: "${found.title}" by ${found.artist}`;
      } else if (selectedArtist) {
        const filtered = songs.filter(song => song.artist === selectedArtist);
        display.innerHTML = `🎶 Songs by ${selectedArtist}:<br>` +
          filtered.map(s => "- " + s.title).join("<br>");
      } else {
        display.textContent = "Please select a song or artist.";
      }
    });
  </script>
</body>
</html>
