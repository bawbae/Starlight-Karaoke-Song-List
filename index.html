<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Song List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎤</text></svg>">
<style>
  body {margin:0;font-family:Arial,sans-serif;background:#0f1720;color:#f8fafc;display:flex;flex-direction:column;min-height:100vh;}
  header {background:#7c3aed;padding:16px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  header h1 {margin:0;font-size:1.5rem;}
  header p {margin:6px 0 0;color:#d1d5db;font-size:0.9rem;}
  .container {flex:1;padding:16px;display:flex;flex-direction:column;}
  .tabs {display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .tab {padding:8px 16px;background:#1f2937;border-radius:10px;cursor:pointer;user-select:none;}
  .tab.active {background:#4338ca;font-weight:bold;}
  .search {margin-bottom:12px;}
  input[type="search"] {width:100%;padding:12px;border-radius:10px;border:2px solid #7c3aed;font-size:1rem;}
  main {flex:1;overflow:auto;}
  ul {list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  li.song {background:#1f2937;padding:14px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.5);transition: background 0.3s;}
  li.song.new {background:#facc15;color:#0f1720;transition: background 2s;}
  li.song:hover {background:#4338ca;}
  h2 {margin:0 0 6px;font-size:1.05rem;}
  p.artist {margin:0;font-size:.9rem;color:#d1d5db;}
  li.center {grid-column:1/-1;text-align:center;color:#9ca3af;}
  footer {padding:10px;text-align:center;background:#2b2f36;font-size:.9rem;color:#9ca3af;}
</style>
</head>
<body>
<header>
  <h1>🎤 Karaoke Song List</h1>
  <p>Search by title, artist, or genre — auto-updates from Google Sheets.</p>
</header>
<div class="container">
  <div class="tabs" id="genreTabs"></div>
  <div class="search">
    <input id="searchInput" type="search" placeholder="Search by title or artist..." autocomplete="off">
  </div>
  <main>
    <ul id="songList">
      <li class="center">Loading songs...</li>
    </ul>
  </main>
</div>
<footer>Made with ❤️ for your Karaoke Room</footer>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-ShkhGuOKQxoMoKnvsvYbwsALudMu6afLjolYpD1bY00aOeZlODjdVa3tsFpdXnQYfgDFTRrYkp4E/pub?gid=0&single=true&output=csv";
const songList = document.getElementById("songList");
const searchInput = document.getElementById("searchInput");
const genreTabs = document.getElementById("genreTabs");
let songs = [];
let lastSongTitles = [];
let currentGenre = "All";

function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));}

function renderTabs(){
  const genres = Array.from(new Set(songs.map(s=>s.genre).filter(g=>g))).sort();
  genres.unshift("All");
  genreTabs.innerHTML="";
  genres.forEach(g=>{
    const div=document.createElement("div");
    div.className="tab"+(g===currentGenre?" active":"");
    div.textContent=g;
    div.addEventListener("click",()=>{currentGenre=g; renderTabs(); renderSongs(searchInput.value);});
    genreTabs.appendChild(div);
  });
}

function renderSongs(filterText=""){
  songList.innerHTML="";
  const q = filterText.toLowerCase().trim();
  const filtered = songs.filter(s=>{
    if(!s.title) return false;
    const matchGenre = currentGenre==="All" || s.genre===currentGenre;
    return matchGenre && (s.title.toLowerCase().includes(q) || (s.artist||"").toLowerCase().includes(q));
  });
  if(filtered.length===0){songList.innerHTML=`<li class="center">No songs found</li>`;return;}
  filtered.forEach(s=>{
    const li=document.createElement("li");
    li.className="song";
    li.innerHTML=`<h2>${escapeHtml(s.title)}</h2><p class="artist">by ${escapeHtml(s.artist||"Unknown")}</p>`;
    if(!lastSongTitles.includes(s.title)){
      li.classList.add("new");
      setTimeout(()=>li.classList.remove("new"),2000);
    }
    songList.appendChild(li);
  });
}

function fetchSongs(){
  Papa.parse(sheetURL,{
    download:true,
    header:false, // ignore headers
    skipEmptyLines:true,
    encoding:"UTF-8",
    complete:function(results){
      // skip first row (A/B/C headers)
      const dataRows = results.data.slice(1);
      const newSongs = dataRows.map(row=>{
        const title=row[0]?row[0].replace(/^\uFEFF/,"").trim():"";
        const artist=row[1]?row[1].trim():"";
        const genre=row[2]?row[2].trim():"";
        return {title,artist,genre};
      }).filter(r=>r.title.length>0);
      lastSongTitles = songs.map(s=>s.title);
      songs = newSongs;
      renderTabs();
      renderSongs(searchInput.value);
    },
    error:function(err){
      songList.innerHTML=`<li class="center" style="color:tomato">Error: ${err.message}</li>`;
    }
  });
}

searchInput.addEventListener("input",e=>renderSongs(e.target.value));
fetchSongs();
setInterval(fetchSongs,15000); // auto-update every 15 seconds
</script>
</body>
</html>
