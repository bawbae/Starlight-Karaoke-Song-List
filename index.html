<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Starlight Karaoke Song List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
  <header class="bg-purple-700 p-4 text-center shadow-lg">
    <h1 class="text-3xl font-bold">🎤 Starlight Karaoke Song List 🎶</h1>
    <p class="text-sm opacity-80">Search by title or artist — updates from Google Sheets.</p>
  </header>

  <div class="p-4">
    <input id="searchInput" type="text" placeholder="Search by title or artist..." class="w-full p-3 rounded-xl border-2 border-purple-500 text-black" />
  </div>

  <main class="flex-1 overflow-y-auto p-4">
    <ul id="songList" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
      <li class="col-span-full text-center text-gray-400">Loading songs...</li>
    </ul>
  </main>

  <footer class="bg-purple-700 p-3 text-center text-sm opacity-80">
    Made with ❤️ for Starlight Karaoke on Rec Room
  </footer>

  <script>
    const songList = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");

    // === REPLACE this with your published Google Sheets CSV link ===
    const sheetURL = https://docs.google.com/spreadsheets/d/1qX2ApPU9oLH-InTcDSeijk-40GJ9queinXBL8b_lNiY/edit?usp=sharing;
    // =============================================================

    let songs = [];

    function displaySongs(filter = "") {
      songList.innerHTML = "";
      const q = filter.trim().toLowerCase();
      const filtered = songs.filter(song =>
        song.title.toLowerCase().includes(q) || song.artist.toLowerCase().includes(q)
      );
      if (filtered.length === 0) {
        songList.innerHTML = `<li class="col-span-full text-center text-gray-400">No songs found</li>`;
        return;
      }
      filtered.forEach(song => {
        const li = document.createElement("li");
        li.className = "p-4 bg-gray-800 rounded-2xl shadow hover:bg-purple-600 transition";
        li.innerHTML = `<h2 class="text-lg font-bold">${escapeHtml(song.title)}</h2>
                        <p class="text-sm opacity-80">by ${escapeHtml(song.artist)}</p>`;
        songList.appendChild(li);
      });
    }

    // basic HTML-escape to avoid accidental markup injection if sheet contains HTML
    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
    }

    // Normalize a parsed row to {title, artist}
    function normalizeRow(row) {
      // try common header names then fallback to positional
      const keys = Object.keys(row);
      const firstVal = (keys.length > 0) ? row[keys[0]] : "";
      const secondVal = (keys.length > 1) ? row[keys[1]] : "";
      const title = (row["Title"] ?? row["title"] ?? row["Song"] ?? row["song"] ?? firstVal ?? "").toString().trim();
      const artist = (row["Artist"] ?? row["artist"] ?? row["Performer"] ?? row["Singer"] ?? secondVal ?? "").toString().trim();
      return { title, artist };
    }

    // Fetch & parse CSV using PapaParse (handles commas, quotes)
    function fetchSongs() {
      songList.innerHTML = `<li class="col-span-full text-center text-gray-400">Loading songs...</li>`;
      Papa.parse(sheetURL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          try {
            songs = results.data.map(normalizeRow).filter(r => r.title);
            displaySongs();
          } catch (err) {
            songList.innerHTML = `<li class="col-span-full text-center text-red-400">Error parsing sheet</li>`;
            console.error(err);
          }
        },
        error: function(err) {
          songList.innerHTML = `<li class="col-span-full text-center text-red-400">Failed to load songs (${err.message})</li>`;
          console.error(err);
        }
      });
    }

    searchInput.addEventListener("input", (e) => displaySongs(e.target.value));

    // initial load
    fetchSongs();
  </script>
</body>
</html>
